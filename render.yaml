# Render Blueprint for the API: https://render.com/docs/blueprint-spec
# Values marked `sync: false` are secrets you paste into the Render dashboard; they never live in git.
services:
  - type: web
    name: fleetflow-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrate, add demo data if the database is empty, then serve.
    # --proxy-headers: Render sits in front of the app, so the real client IP comes from X-Forwarded-For.
    #   Without it every visitor shares the proxy's IP, and the login lockout would lock everyone out at once.
    # One process only: login lockouts, assistant limits and live-update connections are kept in memory.
    startCommand: python -m scripts.init_db --seed && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DEMO_MODE
        value: "true"
      - key: DATABASE_URL
        sync: false # Neon connection string, e.g. postgresql://user:pass@ep-xxx.neon.tech/fleetflow?sslmode=require
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false # JSON list with your Vercel URL, e.g. ["https://fleetflow.vercel.app"]
      - key: FRONTEND_URL
        sync: false # e.g. https://fleetflow.vercel.app (used in email links)
      - key: DEPOT_TIMEZONE
        value: Asia/Karachi
      - key: GEMINI_API_KEY
        sync: false # optional; leave empty to keep the AI assistant off
